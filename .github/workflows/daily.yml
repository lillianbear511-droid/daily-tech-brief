name: daily brief

on:
  schedule:
    # Two issues a day, three shots at each.
    #
    # GitHub's cron is best effort and has started this repo's jobs anywhere
    # from a few minutes to seven hours late. With one cron per issue, a late
    # run did not just arrive late: the 20:05 job started at 03:16 the next
    # morning, so the evening brief got dated to the following day and the day
    # it belonged to went empty. Three shots per issue — plus a slot decided by
    # target time instead of by which cron fired — makes lateness and transient
    # failures harmless: the retry runs find the issue already built and quit
    # before installing anything.
    #
    # UTC in, Asia/Shanghai (UTC+8) out.
    # GitHub warns that the start of every hour is the most congested slot for
    # scheduled runs and advises picking another minute. Every old cron sat at
    # :05 or :35 and this repo's jobs were arriving 6-8 hours late. Keep the
    # three-shots-per-issue design, but move off the top of the hour.
    - cron: "23 23 * * *"    # 07:23 morning
    - cron: "47 0 * * *"     # 08:47 morning, retry
    - cron: "13 2 * * *"     # 10:13 morning, retry
    - cron: "23 12 * * *"    # 20:23 evening
    - cron: "47 13 * * *"    # 21:47 evening, retry
    - cron: "13 15 * * *"    # 23:13 evening, retry
  workflow_dispatch:        # manual run from the Actions tab
    inputs:
      slot:
        description: "Which issue to build"
        type: choice
        options: [auto, am, pm, none]
        default: auto
      dry_run:
        description: "Test story picking + rewrite only (no audio, no commit, no push)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Without this the runner's date.today() returns the UTC date, so the
    # 23:05 UTC job would rebuild yesterday's issue and mail it every morning.
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      # Which issue is due, and is it already here? Answered before ffmpeg or
      # pip run, so a retry of an already-built issue costs seconds and cannot
      # fail in the toolchain and page you with a false alarm.
      - name: Which issue is due?
        id: check
        env:
          SLOT: ${{ inputs.slot || 'auto' }}
        run: |
          python3 - <<'PY'
          import os, sys
          from datetime import datetime
          from pathlib import Path
          sys.path.insert(0, "pipeline")
          import slots

          arg = os.environ.get("SLOT", "auto")
          now = datetime.now()
          if slots.is_auto(arg):
              day, slot = slots.due(now)
          else:
              day, slot = now.date().isoformat(), slots.resolve(arg)
          slug = slots.make(day, slot)
          skip = Path("data", f"{slug}.json").exists()
          # `skip` is the only de-duplication needed: retry runs stop here, so
          # every issue is built at most once and therefore gets at most one
          # card. GitHub cron has been arriving 6-8 hours late on this repo,
          # which puts the evening issue at 3-5am. Suppressing "stale" cards
          # then silently deleted the whole issue from the user's day.
          print(f"issue: {slug} · skip={skip}", flush=True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"slug={slug}\nskip={'true' if skip else 'false'}\n")
          PY

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true' || inputs.dry_run == true
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: inputs.dry_run != true && steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt

      - name: Pick, rewrite, voices, data
        id: build
        if: inputs.dry_run != true && steps.check.outputs.skip != 'true'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          SLOT: ${{ inputs.slot || 'auto' }}
        run: |
          set +e
          python pipeline/daily.py --skip-push --slot "$SLOT"
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "Nothing to do: this issue is already built."
          elif [ "$code" -ne 0 ]; then
            echo "daily.py failed with $code"
            exit "$code"
          fi

      - name: Dry run - pick and rewrite only
        if: inputs.dry_run == true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          python -c "from datetime import date, datetime, timezone; print('runner sees today as', date.today().isoformat(), '| utc', datetime.now(timezone.utc).isoformat(timespec='minutes'), '| local', datetime.now().isoformat(timespec='minutes'))"
          python pipeline/compose.py --dry-run --slot ${{ inputs.slot || 'auto' }}

      # edge-tts and ffmpeg are the two things that only fail on the runner,
      # never on a laptop. Say so before 7am rather than at 7am.
      - name: Dry run - voice toolchain check
        if: inputs.dry_run == true
        run: |
          python - <<'PY'
          import sys, tempfile
          from pathlib import Path
          sys.path.insert(0, "pipeline")
          import generate as g
          out = Path(tempfile.mkdtemp()) / "probe.mp3"
          g.tts_edge("This is a voice check for the daily brief.", out,
                     g.DEFAULT_VOICE, g.DEFAULT_RATE)
          secs = g.duration_seconds(out)
          print(f"edge-tts ok · {out.stat().st_size} bytes · {secs}s")
          assert secs > 1, "ffprobe could not read the mp3"
          print("ffprobe ok")
          PY

      - name: Commit
        if: inputs.dry_run != true && steps.check.outputs.skip != 'true' && steps.build.outputs.built != 'false'
        env:
          SLUG: ${{ steps.build.outputs.slug || steps.check.outputs.slug }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "daily-brief bot"
          git config user.email "bot@users.noreply.github.com"
          git add data audio content
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "brief: $SLUG"
            git push
            # A push made with GITHUB_TOKEN fires no push event, so without
            # this the site keeps serving the previous build: data 200 on the
            # repo, 404 and dead audio on the web. repository_dispatch is one
            # of the two events GITHUB_TOKEN *is* allowed to trigger.
            if curl -sSf -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/dispatches" \
              -d '{"event_type":"publish"}' > /dev/null; then
              echo "deploy queued for $SLUG"
            else
              echo "repository_dispatch refused; falling back to workflow_dispatch"
              gh workflow run pages.yml --ref main
            fi
          fi

      - name: Wait for the issue to be live
        if: inputs.dry_run != true && steps.check.outputs.skip != 'true' && steps.build.outputs.built != 'false'
        env:
          SLUG: ${{ steps.build.outputs.slug || steps.check.outputs.slug }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          python3 - <<'PY'
          import os, time, urllib.request
          base = (os.environ.get("APP_URL") or
                  "https://lillianbear511-droid.github.io/daily-tech-brief").rstrip("/")
          slug = os.environ["SLUG"]
          targets = [f"data/{slug}.json", f"audio/{slug}-full.mp3"]
          deadline = time.time() + 600
          while time.time() < deadline:
              ok = True
              for t in targets:
                  try:
                      req = urllib.request.Request(
                          f"{base}/{t}?v={int(time.time())}", method="HEAD")
                      with urllib.request.urlopen(req, timeout=10) as r:
                          ok = ok and r.status == 200
                  except Exception:
                      ok = False
              if ok:
                  print(f"live: {slug}")
                  break
              time.sleep(15)
          else:
              print(f"WARNING: {slug} not live after 10 min; sending the card anyway")
          PY

      - name: Push to Feishu
        if: inputs.dry_run != true && steps.check.outputs.skip != 'true' && steps.build.outputs.built != 'false'
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          APP_URL: ${{ secrets.APP_URL }}
          SLUG: ${{ steps.build.outputs.slug || steps.check.outputs.slug }}
        run: python pipeline/push_feishu.py --strict-today --date "$SLUG"

      # A silent failure here means no brief and no explanation, so say so —
      # but only for a run that was actually trying to build something.
      - name: Report failure
        if: failure() && inputs.dry_run != true && steps.check.outputs.skip != 'true'
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          APP_URL: ${{ secrets.APP_URL }}
          SLUG: ${{ steps.check.outputs.slug || 'this' }}
        run: python pipeline/push_feishu.py --alert "the $SLUG issue did not build, see the Actions log"
