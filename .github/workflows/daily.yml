name: daily brief

on:
  schedule:
    # 23:05 UTC = 07:05 Asia/Shanghai. GitHub cron is UTC and often runs late;
    # 5 minutes of slack keeps the card near 7am rather than 7:20.
    - cron: "5 23 * * *"
  workflow_dispatch:        # manual run from the Actions tab
    inputs:
      dry_run:
        description: "Test story picking + rewrite only (no audio, no commit, no push)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 23:05 UTC is 07:05 the NEXT day in Shanghai. Without this the runner's
    # date.today() returns the UTC date, so the job would rebuild (or skip)
    # yesterday's brief and mail it again every single morning.
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt

      - name: Dry run - pick and rewrite only
        if: inputs.dry_run == true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          python -c "from datetime import date, datetime, timezone; print('runner sees today as', date.today().isoformat(), '| utc', datetime.now(timezone.utc).isoformat(timespec='minutes'), '| local', datetime.now().isoformat(timespec='minutes'))"
          python pipeline/compose.py --dry-run

      # edge-tts and ffmpeg are the two things that only fail on the runner,
      # never on a laptop. Say so before 7am rather than at 7am.
      - name: Dry run - voice toolchain check
        if: inputs.dry_run == true
        run: |
          python - <<'PY'
          import sys, tempfile
          from pathlib import Path
          sys.path.insert(0, "pipeline")
          import generate as g
          out = Path(tempfile.mkdtemp()) / "probe.mp3"
          g.tts_edge("This is a voice check for the daily brief.", out,
                     g.DEFAULT_VOICE, g.DEFAULT_RATE)
          secs = g.duration_seconds(out)
          print(f"edge-tts ok · {out.stat().st_size} bytes · {secs}s")
          assert secs > 1, "ffprobe could not read the mp3"
          print("ffprobe ok")
          PY

      # daily.py refuses to rebuild a day that already exists, so a re-run of
      # this workflow never overwrites a brief you have already read.
      - name: Pick, rewrite, voices, data
        if: inputs.dry_run != true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python pipeline/daily.py --skip-push

      - name: Commit
        if: inputs.dry_run != true
        run: |
          git config user.name  "daily-brief bot"
          git config user.email "bot@users.noreply.github.com"
          git add data audio content
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "brief: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Push to Feishu
        if: inputs.dry_run != true
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          APP_URL: ${{ secrets.APP_URL }}
        run: python pipeline/push_feishu.py --strict-today

      # A silent failure here means no brief and no explanation, so say so.
      - name: Report failure
        if: failure() && inputs.dry_run != true
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          APP_URL: ${{ secrets.APP_URL }}
        run: python pipeline/push_feishu.py --alert "the 07:05 build failed, see the Actions log"
