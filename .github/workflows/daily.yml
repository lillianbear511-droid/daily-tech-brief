name: daily brief

on:
  schedule:
    # Two issues a day. GitHub cron is UTC and often starts hours late, so each
    # one keeps a few minutes of slack and the slot is decided by the cron that
    # fired — not by the clock, which would drift across the boundary.
    #
    # 23:05 UTC = 07:05 Asia/Shanghai — morning issue
    - cron: "5 23 * * *"
    # 12:05 UTC = 20:05 Asia/Shanghai — evening issue
    - cron: "5 12 * * *"
  workflow_dispatch:        # manual run from the Actions tab
    inputs:
      slot:
        description: "Which issue to build"
        type: choice
        options: [auto, am, pm, none]
        default: auto
      dry_run:
        description: "Test story picking + rewrite only (no audio, no commit, no push)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Without this the runner's date.today() returns the UTC date, so the
    # 23:05 UTC job would rebuild yesterday's issue and mail it every morning.
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The cron that fired says which issue this is. A manual run defaults to
      # "auto", which the scripts read off the local hour.
      - name: Resolve issue slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "5 12 * * *") echo "slot=pm" >> "$GITHUB_OUTPUT" ;;
              *)            echo "slot=am" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo "slot=${{ inputs.slot || 'auto' }}" >> "$GITHUB_OUTPUT"
          fi
          echo "Building slot: $(grep slot= "$GITHUB_OUTPUT" | cut -d= -f2)"

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt

      - name: Dry run - pick and rewrite only
        if: inputs.dry_run == true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          python -c "from datetime import date, datetime, timezone; print('runner sees today as', date.today().isoformat(), '| utc', datetime.now(timezone.utc).isoformat(timespec='minutes'), '| local', datetime.now().isoformat(timespec='minutes'))"
          python pipeline/compose.py --dry-run --slot ${{ steps.slot.outputs.slot }}

      # edge-tts and ffmpeg are the two things that only fail on the runner,
      # never on a laptop. Say so before 7am rather than at 7am.
      - name: Dry run - voice toolchain check
        if: inputs.dry_run == true
        run: |
          python - <<'PY'
          import sys, tempfile
          from pathlib import Path
          sys.path.insert(0, "pipeline")
          import generate as g
          out = Path(tempfile.mkdtemp()) / "probe.mp3"
          g.tts_edge("This is a voice check for the daily brief.", out,
                     g.DEFAULT_VOICE, g.DEFAULT_RATE)
          secs = g.duration_seconds(out)
          print(f"edge-tts ok · {out.stat().st_size} bytes · {secs}s")
          assert secs > 1, "ffprobe could not read the mp3"
          print("ffprobe ok")
          PY

      # daily.py refuses to rebuild an issue that already exists, so a re-run of
      # this workflow never overwrites a brief you have already read — and the
      # morning job cannot touch the evening one.
      - name: Pick, rewrite, voices, data
        if: inputs.dry_run != true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          SLOT: ${{ steps.slot.outputs.slot }}
        run: python pipeline/daily.py --skip-push --slot "$SLOT"

      - name: Commit
        if: inputs.dry_run != true
        env:
          SLOT: ${{ steps.slot.outputs.slot }}
        run: |
          git config user.name  "daily-brief bot"
          git config user.email "bot@users.noreply.github.com"
          git add data audio content
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "brief: $(date +%Y-%m-%d) ${SLOT}"
            git push
          fi

      - name: Push to Feishu
        if: inputs.dry_run != true
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          APP_URL: ${{ secrets.APP_URL }}
          SLOT: ${{ steps.slot.outputs.slot }}
        run: python pipeline/push_feishu.py --strict-today --slot "$SLOT"

      # A silent failure here means no brief and no explanation, so say so.
      - name: Report failure
        if: failure() && inputs.dry_run != true
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          APP_URL: ${{ secrets.APP_URL }}
          SLOT: ${{ steps.slot.outputs.slot }}
        run: python pipeline/push_feishu.py --alert "the ${SLOT} issue did not build, see the Actions log"
