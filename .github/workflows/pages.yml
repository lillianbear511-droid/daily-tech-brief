name: deploy pages

# Jekyll's legacy builder kept reporting "Page build failed" on this repo with
# no usable error, and left the published site several commits behind. There is
# nothing to build here — it is a static site — so publish the files as-is.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage only what the site serves
        run: |
          mkdir -p _site
          cp index.html app.js coach.js assess.js styles.css sw.js manifest.json .nojekyll _site/
          cp -r data audio content icons _site/
          echo "staged $(find _site -type f | wc -l) files, $(du -sh _site | cut -f1)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
